<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>용인중학교 공간재구조화 3D 모형</title>
<meta name="description" content="용인중학교 경기형 공간재구조화 사전기획 보고서 87–94쪽 평면·단면·조감도를 근거로 만든 3D 스터디 모형">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="용인중학교 공간재구조화 3D 모형">
<meta property="og:description" content="사전기획(안) 층별 평면과 광장형 증축·데크를 3D로 살펴보는 모형">
<meta property="og:type" content="website">
<meta name="theme-color" content="#E4E8EC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#E4E8EC; --panel:#FFFFFF; --ink:#26303B; --ink-2:#5D6875; --line:#D3D9DF;
  --new:#D9678F; --add:#5E9537; --focus:#2F6FD0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#1B2128; --panel:#252D36; --ink:#E8EDF2; --ink-2:#A7B2BE; --line:#3B4652; --new:#E0759B; --add:#86BD5E; --focus:#6FA3F0;
  }
}
:root[data-theme="dark"]{
  --board:#1B2128; --panel:#252D36; --ink:#E8EDF2; --ink-2:#A7B2BE; --line:#3B4652; --new:#E0759B; --add:#86BD5E; --focus:#6FA3F0;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.labels{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.head{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;max-width:340px;z-index:5;pointer-events:none}
.head h1{margin:0;font-size:21px;line-height:1.25;font-weight:700;letter-spacing:-0.01em}
.head p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}

.stack{position:fixed;left:16px;top:50%;transform:translateY(-42%);z-index:5;display:flex;flex-direction:column;gap:5px;width:208px}
.roof-cap{height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:10px solid var(--line);margin:0 auto -2px;width:72%}
.lv{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:7px 10px 7px 8px;cursor:pointer;transition:background .15s,border-color .15s}
.lv b{font-size:20px;font-weight:700;line-height:1;text-align:center;color:var(--ink-2)}
.lv span{font-size:12px;line-height:1.35;color:var(--ink)}
.lv span small{display:block;color:var(--ink-2);font-size:11px}
.lv:hover{border-color:var(--ink-2)}
.lv[aria-pressed="true"]{background:var(--new);border-color:var(--new)}
.lv[aria-pressed="true"] b,.lv[aria-pressed="true"] span,.lv[aria-pressed="true"] small{color:#fff}
.lv.all{grid-template-columns:1fr;text-align:center;font-size:13px;font-weight:600;margin-top:6px;border-radius:999px;padding:8px}
.ground{height:3px;background:var(--ink-2);opacity:.5;border-radius:2px;margin-top:2px}

.info{position:fixed;left:240px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;width:min(420px,calc(100vw - 520px));min-width:290px;max-height:calc(100vh - 150px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px 12px}
.info h2{margin:0;font-size:15.5px;line-height:1.35;font-weight:700}
.info .sub{margin:2px 0 8px;font-size:12.5px;color:var(--new);font-weight:600}
.info.north .sub,.info.south .sub{color:var(--add)}
.info.deck .sub{color:#A2764B}
.info ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.6}
.info .room{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.55;display:none}
.info .room.show{display:block}
.info .room strong{font-size:14px}
.info .hint{margin:8px 0 0;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.ctl{margin-top:10px}
.ctl h4{margin:0 0 5px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.row label{display:flex;gap:7px;align-items:center;font-size:12.5px;cursor:pointer}
.row input{accent-color:var(--new)}
.bigbtn{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.exit{border:0;background:transparent;font-size:12px;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px}

.tools{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.toggles{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.toggles label{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0;cursor:pointer}
.toggles input{accent-color:var(--new)}
.focusbar{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px 10px;width:222px}
.focusbar h3{margin:0 0 6px;font-size:12.5px;font-weight:600}
.focusbar button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:4px;padding:6px 9px;margin-top:5px;font-size:12.5px;line-height:1.35;cursor:pointer}
.focusbar button small{display:block;font-size:11px;color:var(--ink-2)}
.focusbar button:hover{border-color:var(--ink-2)}
.focusbar button[aria-pressed="true"]{border-color:var(--add);box-shadow:inset 3px 0 0 var(--add)}
.focusbar button[data-f="deck"][aria-pressed="true"]{border-color:#C9A27A;box-shadow:inset 3px 0 0 #C9A27A}

.legend{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:222px}
.legend h3{margin:0 0 6px;font-size:12.5px;font-weight:600}
.legend .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
.legend div{font-size:11.5px;white-space:nowrap}
.legend .mass{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.legend .flow i{height:3px;width:14px;border:0;vertical-align:3px}
.legend p{margin:8px 0 0;font-size:10.5px;color:var(--ink-2);line-height:1.45}

.zoompad{position:fixed;right:250px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:none;flex-direction:column;gap:6px}
.lv.all .sm{display:none}
.zoompad button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;line-height:1;cursor:pointer}
.zoompad button:hover{border-color:var(--ink-2)}
body.focusing .zoompad{display:flex}

/* enlarged view: the 3D takes the whole screen */
body.big .stack,body.big .legend,body.big .toggles,body.big .head p,body.big .focusbar h3,body.big .focusbar small,body.big .info ul,body.big .info .hint{display:none}
body.big .focusbar{width:auto;display:flex;gap:4px;padding:4px}
body.big .focusbar button{margin:0;padding:5px 9px}
body.big .info{left:16px;width:min(560px,calc(100vw - 32px));padding:10px 12px}
body.big .zoompad{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}

.lbl{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:11px;font-weight:600;color:#26303B;background:rgba(255,255,255,.88);padding:2px 6px;border-radius:3px;white-space:nowrap;border:1px solid rgba(38,48,59,.14);line-height:1.2}
.lbl.room{text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.lbl.bld{font-size:12.5px;font-weight:700;background:#26303B;color:#fff;border:0;padding:3px 8px}
.lbl.bld.new{background:#C8527C}
.lbl.bld.add{background:#5E9537}
.lbl.pin{background:#C8322F;color:#fff;border:0}
.lbl.out{background:rgba(255,255,255,.72);color:#3A5A2A}
.lbl.el{font-size:10px;font-weight:500;background:rgba(38,48,59,.78);color:#fff;border:0;padding:1px 4px;border-radius:2px}
.lbl.zone{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid rgba(38,48,59,.25)}
.lbl.zone.b{background:#C9DDF4}
.lbl.zone.g{background:#DDEDC4}
.lbl.det{background:#FFFFFF;color:#1F2B36;border:1px solid #9AA5B1;font-weight:600}
.lbl.det::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#5E9537;margin-right:5px;vertical-align:1px}
.lbl.det.conn{border-color:#2F6FD0}
.lbl.det.conn::before{background:#2F6FD0;border-radius:1px;transform:rotate(45deg)}
.lbl.det.deckc::before{background:#B0845A}
.lbl.sel{outline:2px solid #2F6FD0}
.lbl.fit-hide{display:none !important}

/* collapsible legend */
.legend summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;min-height:24px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:"▾";font-size:11px;color:var(--ink-2)}
.legend details:not([open]) summary::after{content:"▸"}
.legend details[open] summary{margin-bottom:6px}
.optbtn,.info-toggle{display:none}
button,.chip,.lv,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* short desktop / laptop windows */
@media (min-width:861px) and (max-height:760px){
  .head p{display:none}
  .stack{transform:translateY(-50%);gap:3px}
  .lv{padding:5px 10px 5px 8px}
  .lv b{font-size:17px}
  .focusbar button small{display:none}
  .info{max-height:calc(100vh - 110px)}
}

/* phones, small tablets and landscape phones */
@media (max-width:860px), (max-height:520px){
  .head{top:calc(12px + env(safe-area-inset-top,0px));left:12px;max-width:calc(100vw - 130px)}
  .head h1{font-size:15px;line-height:1.3}
  .head p{display:none}
  .tools{top:calc(8px + env(safe-area-inset-top,0px));right:8px;left:auto;flex-direction:row;align-items:center;gap:6px}
  .optbtn{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;cursor:pointer}
  .optbtn[aria-expanded="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  .seg{display:none}
  .focusbar{position:fixed;left:8px;right:8px;top:calc(60px + env(safe-area-inset-top,0px));width:auto;display:flex;gap:4px;padding:4px;overflow-x:auto;scrollbar-width:none}
  .focusbar::-webkit-scrollbar{display:none}
  .focusbar h3,.focusbar button small{display:none}
  .focusbar button{margin:0;flex:1 0 auto;width:auto;min-height:40px;font-size:12.5px;padding:6px 10px;white-space:nowrap}
  .lv.all .lg{display:none}
  .lv.all .sm{display:inline}
  .toggles,.legend{display:none}
  /* “보기 설정” sheet: views, toggles and legend stacked above the floor row */
  body.opts-open .toggles{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:9;padding:8px 12px;box-shadow:0 4px 18px rgba(0,0,0,.14)}
  body.opts-open .toggles label{min-height:40px}
  body.opts-open .seg{display:flex;position:fixed;left:8px;right:8px;bottom:calc(166px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 4px 18px rgba(0,0,0,.14)}
  body.opts-open .seg button{flex:1;min-height:40px}
  body.opts-open .legend{display:block;left:8px;right:8px;width:auto;bottom:calc(222px + env(safe-area-inset-bottom,0px));z-index:9;max-height:calc(100vh - 300px);overflow:auto;box-shadow:0 4px 18px rgba(0,0,0,.14)}
  body.opts-open .info,body.opts-open .zoompad{display:none}
  .stack{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;transform:none;width:auto;flex-direction:row-reverse;gap:4px}
  .roof-cap,.ground{display:none}
  .lv{grid-template-columns:1fr;padding:0 2px;flex:1;min-height:50px}
  .lv span{display:none}
  .lv b{font-size:17px}
  .lv.all{margin-top:0;border-radius:4px;font-size:13px;flex:1.3}
  .info{left:8px;right:8px;width:auto;min-width:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding:10px 50px 10px 12px;max-height:46vh}
  .info h2{font-size:14.5px;cursor:pointer}
  .info .sub{margin-bottom:0}
  .info ul,.info .hint{display:none}
  .info.expanded ul,.info.expanded .hint{display:block}
  .info.expanded .sub{margin-bottom:8px}
  .info-toggle{display:flex;position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);align-items:center;justify-content:center;font-size:14px;cursor:pointer}
  .ctl{margin-top:8px}
  .ctl h4{margin-bottom:4px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-height:38px;padding:6px 12px;font-size:12.5px}
  .row{margin-top:8px}
  .bigbtn{min-height:40px}
  .zoompad{right:8px;top:44%;bottom:auto}
  .zoompad button{width:46px;height:46px}
  .info.expanded ~ .zoompad{display:none}
  body.big .focusbar,body.big .stack,body.big .head{display:none}
  body.big .info{left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  body.big .zoompad{top:36%;bottom:auto}
  .lbl{font-size:10.5px}
  .lbl.bld{font-size:11.5px;padding:2px 7px}
}
/* landscape phones: no title row, focus buttons move to the top-left */
@media (max-height:520px){
  .head{display:none}
  .focusbar{top:calc(8px + env(safe-area-inset-top,0px));right:auto;max-width:calc(100vw - 150px)}
  .info{top:calc(58px + env(safe-area-inset-top,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));right:auto;width:min(360px,44vw);max-height:none}
  body.big .info{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(360px,44vw);right:auto;max-height:70vh}
  .lv{min-height:42px}
  .info.expanded ul{display:block}
  body.opts-open .legend{max-height:calc(100vh - 240px)}
}
@media (prefers-reduced-motion: reduce){ .lv{transition:none} }
</style>
</head>
<body>
<div id="stage"></div>

<header class="head">
  <h1>용인중학교 공간재구조화 3D 모형</h1>
  <p>사전기획 보고서 87–94쪽의 배치도·층별 평면·단면도를 근거로 재구성한 스터디 모형입니다. 왼쪽에서 층을 누르면 그 높이에서 건물을 잘라 실 배치를 보여줍니다.</p>
</header>

<nav class="stack" aria-label="층 선택">
  <div class="roof-cap" aria-hidden="true"></div>
  <button class="lv" data-lv="5" aria-pressed="false"><b>5</b><span>옥상층<small>식당동 4층 · 3호동 5층</small></span></button>
  <button class="lv" data-lv="4" aria-pressed="false"><b>4</b><span>개축동 4층<small>1호동·식당동 3층</small></span></button>
  <button class="lv" data-lv="3" aria-pressed="false"><b>3</b><span>개축동 3층<small>1호동·식당동 2층</small></span></button>
  <button class="lv" data-lv="2" aria-pressed="false"><b>2</b><span>개축동 2층<small>1호동·식당동 1층</small></span></button>
  <button class="lv" data-lv="1" aria-pressed="false"><b>1</b><span>개축동 1층<small>운동장 레벨 · 필로티</small></span></button>
  <div class="ground" aria-hidden="true"></div>
  <button class="lv all" data-lv="0" aria-pressed="true"><span class="lg">전체 모형 보기</span><span class="sm">전체</span></button>
</nav>

<section class="info" id="info" aria-live="polite">
  <button class="info-toggle" id="infoToggle" aria-expanded="false" aria-label="설명 펼치기">▴</button>
  <h2 id="infoTitle"></h2>
  <div class="sub" id="infoSub"></div>
  <ul id="infoList"></ul>
  <div id="focusCtl"></div>
  <div class="room" id="roomBox"></div>
  <p class="hint" id="hint"></p>
</section>

<div class="tools">
  <div class="seg" role="group" aria-label="시점" id="viewSeg">
    <button data-view="bird" aria-pressed="true">조감</button>
    <button data-view="top" aria-pressed="false">평면</button>
    <button data-view="field" aria-pressed="false">운동장에서</button>
  </div>
  <button class="optbtn" id="optBtn" aria-expanded="false">보기 설정</button>
  <div class="focusbar" role="group" aria-label="크게 바뀌는 세 곳">
    <h3>크게 바뀌는 세 곳</h3>
    <button data-f="north" aria-pressed="false">광장형 증축 (북측)<small>러닝센터 · 능동학습실 · 옥상데크</small></button>
    <button data-f="south" aria-pressed="false">광장형 증축 (남측)<small>커뮤니티 스텝 · 복층 로비</small></button>
    <button data-f="deck" aria-pressed="false">운동장 쪽 데크<small>데크 · 그늘회랑 · 연결 계단</small></button>
  </div>
  <div class="toggles">
    <label><input type="checkbox" id="tLabels" checked> 이름 표시</label>
    <label><input type="checkbox" id="tFlow" checked> 동선·레벨 표시</label>
    <label><input type="checkbox" id="tGhost" checked> 위층 윤곽 보기</label>
    <label><input type="checkbox" id="tLand" checked> 수목</label>
  </div>
</div>

<div class="zoompad" role="group" aria-label="확대·축소">
  <button id="zIn" aria-label="확대">+</button>
  <button id="zOut" aria-label="축소">−</button>
</div>

<aside class="legend" aria-label="범례">
<details id="legendBox" open><summary>공간 용도 · 범례</summary>
  <div class="grid" id="legendGrid"></div>
  <div class="grid mass">
    <div><i style="background:#E79AB6"></i>개축교사동</div>
    <div><i style="background:#A9D485"></i>광장형 증축</div>

function add(m,parent,shadow){ m.castShadow=shadow!==false; m.receiveShadow=true; (parent||P).add(m); return m; }
function boxAt(cx,cy,cz,w,h,d,m,parent){ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(cx,cy,cz); return add(o,parent); }
function rectBox(x1,z1,x2,z2,y0,h,m,parent){ return boxAt((X(x1)+X(x2))/2,y0+h/2,(Z(z1)+Z(z2))/2,Math.abs(X(x2)-X(x1)),h,Math.abs(Z(z2)-Z(z1)),m,parent); }

/* stair drawn as two flights with a landing inside a core outline */
function stairCore(x1,z1,x2,z2,y,h){
  const n=8, H=h-0.3, alongZ=(z2-z1)>=(x2-x1);
  if(alongZ){
    const xm=(x1+x2)/2, land=Math.min(12,(z2-z1)*0.25), zr=z2-z1-land, d=zr/n;
    for(let i=0;i<n;i++){ rectBox(x1+1,z2-(i+1)*d,xm-0.5,z2-i*d,y,H/2*(i+1)/n,M.core); }
    rectBox(x1+1,z1+1,x2-1,z1+land,y,H/2,M.core);
    for(let i=0;i<n;i++){ rectBox(xm+0.5,z1+land+i*d,x2-1,z1+land+(i+1)*d,y,H/2+H/2*(i+1)/n,M.core); }
  } else {
    const zm=(z1+z2)/2, land=Math.min(12,(x2-x1)*0.25), xr=x2-x1-land, d=xr/n;
    for(let i=0;i<n;i++){ rectBox(x2-(i+1)*d,z1+1,x2-i*d,zm-0.5,y,H/2*(i+1)/n,M.core); }
    rectBox(x1+1,z1+1,x1+land,z2-1,y,H/2,M.core);
    for(let i=0;i<n;i++){ rectBox(x1+land+i*d,zm+0.5,x1+land+(i+1)*d,z2-1,y,H/2+H/2*(i+1)/n,M.core); }

}

function fold(p,q,y,h){
  const x1=X(p[0]),z1=Z(p[1]),x2=X(q[0]),z2=Z(q[1]),len=Math.hypot(x2-x1,z2-z1),n=Math.max(2,Math.round(len/0.9)),a=Math.atan2(z2-z1,x2-x1);
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n, o=new THREE.Mesh(new THREE.BoxGeometry(len/n*1.05,h||2.6,0.05),M.fold);
    o.position.set(x1+(x2-x1)*t,y+(h||2.6)/2,z1+(z2-z1)*t); o.rotation.y=-a+(i%2?0.45:-0.45); add(o);
  }
}

/* ---------- building builder: one group per floor ---------- */
const picks=[], floorGroups={};
function building(def){
  floorGroups[def.name]=[];
  def.floors.forEach((f,idx)=>{
    const fg=new THREE.Group(); fg.userData={bld:def.name,idx,off:0,ceils:[]}; world.add(fg); floorGroups[def.name].push(fg); P=fg;
    const y=Y(f.el),h=f.h,lv=levelOf(f.el);
    (f.slab||f.env).forEach(p=>extrude(p,y-0.3,0.3,M.slab));
    if(!f.noCeil) f.env.forEach(p=>fg.userData.ceils.push(extrude(p,y+h-0.3,0.3,M.slab)));
    if(!f.open){
      f.env.forEach((poly,pi)=>{
        const modes=(f.edges&&f.edges[pi])||'';
        for(let i=0;i<poly.length;i++){
          const p=poly[i],q=poly[(i+1)%poly.length], m=modes[i]||'f';
          if(m==='o') continue;
          if(m==='g'){ seg(p,q,y,h-0.3,0.12,M.glass); continue; }
          seg(p,q,y,0.9,0.28,def.fac); seg(p,q,y+0.9,h-1.9,0.12,M.glass); seg(p,q,y+h-1.0,0.7,0.28,def.fac);
        }
        const g=extrudeGeo(poly,y,h);
        const gm=new THREE.Mesh(g,ghostMat); gm.userData.el=f.el; ghosts.add(gm);
        const ge=new THREE.LineSegments(new THREE.EdgesGeometry(g),ghostEdge); ge.userData.el=f.el; ghosts.add(ge);
      });
    }
    (f.rooms||[]).forEach(r=>{
      const [name,type,x1,z1,x2,z2,o0]=r, o=o0||{};
      const plate=rectBox(x1,z1,x2,z2,y+0.005,0.06,TM[type]); plate.castShadow=false;
      plate.userData={name,type,bld:def.name,floor:f.name,el:f.el,lv};
      picks.push(plate);
      if(type==='core'){ stairCore(x1,z1,x2,z2,y,h); }
      else if(!(type==='lounge'||o.open)){
        const pts=rectPoly(x1,z1,x2,z2);
        for(let i=0;i<4;i++) seg(pts[i],pts[(i+1)%4],y,h-0.35,0.14,M.wall).castShadow=false;
      }
      const quiet=(type==='core')||((type==='service'||type==='lounge')&&!o.label)||o.label===false;
      if(!quiet){
        const ly=y+1.3;
        const rec=label(name,'room',new THREE.Vector3((X(x1)+X(x2))/2,ly,(Z(z1)+Z(z2))/2),lv,fg,{
          room:true,short:o.short||SHORT[name]||name,
          corners:[new THREE.Vector3(X(x1),ly,Z(z1)),new THREE.Vector3(X(x2),ly,Z(z1)),new THREE.Vector3(X(x2),ly,Z(z2)),new THREE.Vector3(X(x1),ly,Z(z2))]
        });
        plate.userData.label=rec; rec.plate=plate;
      }
    });
    (f.ev||[]).forEach(e=>evShaft(e[0],e[1],e[2],e[3],y,h));
    (f.folds||[]).forEach(fd=>fold(fd[0],fd[1],y,fd[2]));
    (f.extra||[]).forEach(fn=>fn(y,h,lv));
    P=world;
  });

}

const flowSets=[];
function arrow(pts,m,lv,heads,keys){
  const g=new THREE.Group(); flows.add(g);
  const V3=pts.map(p=>new THREE.Vector3(X(p[0]),Y(p[2])+0.15,Z(p[1])));
  for(let i=0;i<V3.length-1;i++){
    const a=V3[i],b=V3[i+1],len=a.distanceTo(b),dir=b.clone().sub(a).normalize();
    for(let t=0;t<len-0.2;t+=1.1){
      const dl2=Math.min(0.65,len-t), c=a.clone().add(dir.clone().multiplyScalar(t+dl2/2));
      const o=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.06,dl2),m); o.position.copy(c); o.lookAt(c.clone().add(dir)); g.add(o);
    }
  }
  const head=(tip,from)=>{ const d=tip.clone().sub(from).normalize(); const c=new THREE.Mesh(new THREE.ConeGeometry(0.42,1.0,12),m);
    c.position.copy(tip.clone().sub(d.clone().multiplyScalar(0.5))); c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d); g.add(c); };
  if(heads.includes('e')) head(V3[V3.length-1],V3[V3.length-2]);
  if(heads.includes('s')) head(V3[0],V3[1]);
  flowSets.push({g,lv,keys:keys||[]});
}

function refresh(){
  const lvMode=current>0, fm=!!focus;
  const fl=fm?FOCUS[focus].floors[fFloor]:null, fLv=fl&&fl.el!=null?levelOf(fl.el):null;
  labels.forEach(l=>{
    let show;
    if(l.elTag) show=tFlow.checked&&((lvMode&&l.lv===current)||(fm&&(fLv!=null?l.lv===fLv:true)&&inFocus(l)));
    else if(!tLabels.checked) show=false;
    else if(fm){
      if(l.focus) show=l.focus===focus&&(explode||fLv==null||l.lv===fLv);
      else if(l.room) show=(explode?l.plate.userData.bld===FOCUS[focus].bld:(fLv!=null&&l.lv===fLv))&&inFocus(l);
      else if(l.cls.includes('zone')) show=fLv===l.lv&&inFocus(l);
      else show=false;
    }
    else if(l.focus) show=false;
    else if(l.cls.includes('pin')) show=true;
    else if(l.cls.includes('bld')) show=!lvMode;
    else if(l.lv===0) show=true;
    else show=lvMode&&l.lv===current;
    l.o.visible=show; l.el.style.display=show?'':'none';
  });
  flowSets.forEach(s=>{
    s.g.visible=tFlow.checked&&((lvMode&&s.lv.includes(current))||(fm&&!explode&&s.keys.includes(focus)&&(fLv==null||s.lv.includes(fLv))));
  });
  const refEl = lvMode?LEVELS[current].el : (fm&&fl.el!=null&&!fl.top&&!explode?fl.el:null);
  ghosts.children.forEach(o=>{
    if(refEl==null||!tGhost.checked){ o.visible=false; return; }
    if(o.userData.gym){ o.visible=refEl>89; return; }
    o.visible=o.userData.el>refEl+0.6;
  });
  trees.visible=tLand.checked;
  sun.castShadow=(cutTarget>=999)&&!fm;
  applyOffset();
  fitDirty=true; invalidate();
}

  const W=innerWidth,H=innerHeight, land=matchMedia('(max-height:520px)').matches;
  let ox=0,oy=0;
  if(!big){
    if(land) ox=-Math.round(W*0.2);                       // side panel on the left
    else if(isMobile()){ if(focus) oy=Math.round(H*0.17); } // bottom sheet
    else if(focus){ ox=-190; oy=60; }                       // desktop card on the lower left
  }
  if(ox||oy) camera.setViewOffset(W,H,ox,oy,W,H); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
const views={bird:{p:V(-118,128,168),t:V(6,2,2)},top:{p:V(4,235,8),t:V(4,0,4)},field:{p:V(20,14,80),t:V(-8,8,-8)}};
let camAnim=null;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(v){
  if(reduced()){ camera.position.copy(v.p); controls.target.copy(v.t); return; }
  camAnim={from:{p:camera.position.clone(),t:controls.target.clone()},to:v,start:performance.now(),dur:1000};
}
function dolly(f){ const t=(camAnim?camAnim.to.t:controls.target).clone(), p0=camAnim?camAnim.to.p:camera.position; flyTo({t,p:p0.clone().sub(t).multiplyScalar(f).add(t)}); }
function goView(k){
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===k)));
  flyTo(scaled(views[k]));
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{ if(focus) setLevel(0); goView(b.dataset.view); }));
$('zIn').addEventListener('click',()=>dolly(0.75));
$('zOut').addEventListener('click',()=>dolly(1/0.75));
addEventListener('keydown',e=>{ if(e.key==='Escape'&&big) setBig(false); });
{ const v=scaled(views.bird); camera.position.copy(v.p); controls.target.copy(v.t); }

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6) return;
  let cand;
  if(current>0) cand=picks.filter(p=>p.userData.lv===current);
  else if(focus){ const fl=FOCUS[focus].floors[fFloor]; cand=picks.filter(p=>explode?p.userData.bld===FOCUS[focus].bld:(fl.el!=null&&p.userData.lv===levelOf(fl.el))); }
  else return;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(cand,false)[0];
  hit?selectRoom(hit.object):clearSel();
});
const selMat=mat('#2F6FD0');
function clearSel(){
  if(selected){ selected.material=TM[selected.userData.type]; if(selected.userData.label) selected.userData.label.el.classList.remove('sel'); }
  selected=null; $('roomBox').classList.remove('show'); invalidate();
}
function selectRoom(o){
  clearSel(); selected=o; o.material=selMat; const u=o.userData;
  if(u.label) u.label.el.classList.add('sel');
  $('roomBox').innerHTML=`<strong>${u.name}</strong><br>${u.bld} ${u.floor} · 바닥 레벨 EL +${u.el.toFixed(1)}<br>용도: ${TYPES[u.type].n}`;
  $('roomBox').classList.add('show'); invalidate();
  if(isMobile()) setInfoExpanded(true);
}

/* keep room names inside their rooms */
let fitDirty=true, frame=0; const pv=new THREE.Vector3(), lastCam=new THREE.Vector3(), lastTgt=new THREE.Vector3();
function units(s){ let n=0; for(const ch of s){ n+=/[가-힣]/.test(ch)?1:ch===' '?0.32:/[()·.\-]/.test(ch)?0.38:0.62; } return n; }
function fitLabels(){
  const hw=innerWidth/2, hh=innerHeight/2;
  labels.forEach(r=>{
    if(!r.room||!r.o.visible) return;
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(const c of r.corners){ pv.copy(c); r.o.parent.localToWorld(pv); pv.project(camera); const sx=pv.x*hw, sy=-pv.y*hh; if(sx<x0)x0=sx; if(sx>x1)x1=sx; if(sy<y0)y0=sy; if(sy>y1)y1=sy; }
    const w=x1-x0-8, h=y1-y0; let key;
    const nu=units(r.text), fs1=w/nu;
    const LM=isMobile()?11:12;
    if(fs1>=9.5) key=['n',r.text,Math.min(LM,fs1)];
    else{
      const fs2=w/(nu/2+0.6);
      if(fs2>=9.5&&h>=fs2*2.6&&nu>=4) key=['w',r.text,Math.min(LM,fs2)];
      else{ const su=units(r.short), fs3=w/su; key=fs3>=8.5?['n',r.short,Math.min(11,fs3)]:['h']; }
    }
    const k=key.join('|'); if(r.fitKey===k) return; r.fitKey=k;
    if(key[0]==='h'){ r.el.classList.add('fit-hide'); return; }
    r.el.classList.remove('fit-hide');
    r.el.textContent=key[1];
    r.el.style.fontSize=key[2].toFixed(1)+'px';
    r.el.style.padding=key[2]<10.5?'1px 3px':'2px 5px';
    if(key[0]==='w'){ r.el.style.whiteSpace='normal'; r.el.style.maxWidth=Math.max(24,w+8)+'px'; }
    else{ r.el.style.whiteSpace='nowrap'; r.el.style.maxWidth='none'; }
  });
}

function applyTheme(){
  const t=document.documentElement.dataset.theme;
  const dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  scene.background=new THREE.Color(dark?'#1B2128':'#E4E8EC');
  L.board.color.set(dark?'#343C45':'#D7DBD4');
  L.context.color.set(dark?'#58616B':'#F1F1EE');
  invalidate();
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('resize',()=>{
  fitFov(); applyOffset();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); fitDirty=true; invalidate();
});

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function loop(now){
  requestAnimationFrame(loop);
  if(document.hidden) return;
  const tgt=Math.min(cutTarget,40), cur=Math.min(cutNow,40);
  let next=reduced()?tgt:cur+(tgt-cur)*0.12;
  if(Math.abs(next-tgt)<0.01) next=tgt;
  const cutMoving=next!==cur;
  cutNow=(cutTarget>=999&&next>=39.99)?999:next;
  clipPlane.constant=cutNow;
  let moving=false;
  Object.keys(floorGroups).forEach(k=>floorGroups[k].forEach(g=>{
    const d=g.userData.off-g.position.y; if(Math.abs(d)>0.01){ g.position.y+=reduced()?d:d*0.12; moving=true; } else g.position.y=g.userData.off;
  }));
  if(camAnim){ const k=Math.min(1,(now-camAnim.start)/camAnim.dur), e=ease(k);
    camera.position.lerpVectors(camAnim.from.p,camAnim.to.p,e); controls.target.lerpVectors(camAnim.from.t,camAnim.to.t,e); if(k>=1) camAnim=null; }
  const changed=controls.update();
  frame++;
  const camMoved=!lastCam.equals(camera.position)||!lastTgt.equals(controls.target);
  if((camMoved||moving||fitDirty)&&frame%3===0){ fitLabels(); fitDirty=false; lastCam.copy(camera.position); lastTgt.copy(controls.target); }
  if(!(needsRender||changed||cutMoving||moving||camAnim)) return; // render only when something changes (saves battery on phones)
  needsRender=false;
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
}
/* mobile sheet controls */
const optBtn=$('optBtn'), infoToggle=$('infoToggle');
function setOpts(on){ document.body.classList.toggle('opts-open',on); optBtn.setAttribute('aria-expanded',String(on)); }
optBtn.addEventListener('click',()=>setOpts(!document.body.classList.contains('opts-open')));
renderer.domElement.addEventListener('pointerdown',()=>{ if(document.body.classList.contains('opts-open')) setOpts(false); });
function setInfoExpanded(on){ $('info').classList.toggle('expanded',on); infoToggle.setAttribute('aria-expanded',String(on)); infoToggle.textContent=on?'▾':'▴'; infoToggle.setAttribute('aria-label',on?'설명 접기':'설명 펼치기'); }
infoToggle.addEventListener('click',()=>setInfoExpanded(!$('info').classList.contains('expanded')));
$('infoTitle').addEventListener('click',()=>{ if(isMobile()) setInfoExpanded(!$('info').classList.contains('expanded')); });
$('legendBox').open=isMobile()?true:innerHeight>=900;
mq.addEventListener('change',()=>{ setOpts(false); if(!isMobile()) $('legendBox').open=innerHeight>=900; else $('legendBox').open=true; applyOffset(); fitDirty=true; invalidate(); });
setLevel(0);
requestAnimationFrame(loop);
})();
